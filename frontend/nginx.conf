server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Аватарка весит до 2 МБ, с запасом на multipart-обёртку.
    client_max_body_size 3m;

    # Не раскрываем версию nginx в заголовках и на страницах ошибок.
    server_tokens off;

    # Базовые заголовки безопасности. HSTS добавить только вместе с HTTPS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket для socket.io: без Upgrade/Connection сокеты не поднимутся.
    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # SPA: адреса вроде /chat/:id отдаём через index.html.
    location / {
        try_files $uri /index.html;
    }
}
